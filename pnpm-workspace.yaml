# Not a monorepo: an empty `packages` list declares this repo a single-package
# root. The key is optional on pnpm 12, but pnpm 9 and older abort with
# "packages field missing or empty" on any command — including `pnpm exec` —
# when this file exists without it. Cheap insurance for older local installs.
packages: []

# pnpm blocks dependency install scripts by default and fails the install while
# any are undecided, so every package that ships one is listed explicitly. The
# Docker build runs the same pnpm version as local (see "packageManager" in
# package.json), so these decisions apply there too.
#
# true: fetches or builds a native binary, so the script has to run
# (@posthog/cli is the uploader @posthog/nextjs-config calls for source maps).
# false: a no-op for us — core-js only prints a funding notice, protobufjs and
# vue-demi self-configure for a runtime we don't use, and msw would install a
# browser service worker we don't ship.
allowBuilds:
  '@parcel/watcher': true
  '@posthog/cli': true
  '@prisma/engines': true
  '@swc/core': true
  core-js: false
  esbuild: true
  msw: false
  prisma: true
  protobufjs: false
  sharp: true
  vue-demi: false
