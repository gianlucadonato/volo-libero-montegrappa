global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "vlm-nextjs"
    bearer_token: "49f85104-9fb1-4e7c-8025-42a634003ab4"
    static_configs:
      - targets:
          - "vololiberomontegrappa.it"
    scheme: https
    metrics_path: /api/metrics
    authorization:
      credentials: "49f85104-9fb1-4e7c-8025-42a634003ab4"

  - job_name: "prometheus-self"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    metrics_path: /metrics
