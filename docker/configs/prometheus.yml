global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Only the app is scraped. The "loki" and "prometheus-self" jobs were removed:
  # Loki exports one metric per index table it has ever created (period: 24h in
  # loki-config.yml), so its `table` label grew to ~1900 values. Multiplied by
  # histogram buckets that produced ~58k of the ~59k series in the TSDB — 98.5%
  # of a 21GB volume, all of it metrics about the monitoring stack itself.
  - job_name: "vlm-nextjs"
    static_configs:
      - targets:
          - "www.vololiberomontegrappa.it:443"
    scheme: https
    metrics_path: /api/metrics
    authorization:
      credentials: "49f85104-9fb1-4e7c-8025-42a634003ab4"
