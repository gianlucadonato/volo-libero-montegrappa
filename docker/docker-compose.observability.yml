# Observability stack: Loki + Prometheus + Grafana
# Deploy this as a separate Dokploy compose service (not the app).
#
# Prerequisites in Dokploy:
#   1. Create a "dokploy-network" external network if it doesn't exist:
#        docker network create dokploy-network
#   2. Set the following env vars on this Dokploy service:
#        GRAFANA_ADMIN_PASSWORD  (required)
#   3. Point your app's NEXT_PUBLIC_APP_URL domain in configs/prometheus.yml
#      under scrape_configs → vlm-nextjs → targets.
#
# NOTE: the app no longer ships logs to Loki — pino writes JSON to stdout and
# instrumentation.ts forwards records to PostHog Logs over OTLP. Loki stays here
# for the Prometheus/Grafana metrics dashboards; the Grafana log panels in
# configs/grafana/provisioning/dashboards will be empty unless you point another
# collector at it.
#
# Grafana will be accessible via Dokploy's reverse proxy on the domain you configure.

services:
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./configs/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - observability
      - dokploy-network
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
      - dokploy-network

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
      # Uncomment and set if Grafana is served on a subpath:
      # GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  observability:
    driver: bridge
  dokploy-network:
    external: true
