# Builds the production image on GitHub's amd64 runners and pushes it to GHCR.
#
# Why not build on the server: the Dokploy host has 4 cores and 7.5GB shared
# with Postgres and the app itself. A `next build` there drove the load average
# to 77 and took the site offline. Building here keeps production untouched;
# Dokploy only pulls the finished ~350MB image, and the last step tells it to.
name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

# One image build at a time, and a newer push cancels the build in progress:
# every run deploys when it finishes, so parallel runs could finish out of
# order and put an older commit back into production. The newest commit on
# main contains everything the cancelled ones did.
concurrency:
  group: build-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The runner starts with ~14 GB free, and exporting the build cache filled
      # it ("no space left on device" after the image was already pushed). Drop
      # preinstalled toolchains this build never uses, which frees 20+ GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* is inlined into the client bundle at build time, so it
          # has to be a real value here rather than a runtime env var.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            POSTHOG_PROJECT_ID=${{ vars.POSTHOG_PROJECT_ID }}
            GIT_COMMIT_SHA=${{ github.sha }}
          # Uploads the browser source maps to PostHog during the build, so error
          # stack traces are readable. A BuildKit secret, not a build-arg, so the
          # key stays out of the image. When unset the upload is skipped.
          secrets: |
            posthog_personal_api_key=${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          cache-from: type=gha
          # The cache only speeds up the next build: failing to write it must not
          # fail this one, or the deploy step below never runs.
          cache-to: type=gha,mode=max,ignore-error=true

      # Redeploy on Dokploy as soon as the image is pushed. Dokploy's own
      # auto-deploy only reacts to git pushes, not to a new image in a registry,
      # so without this the deploy had to be started by hand. The secret holds
      # the application's deploy webhook (Dokploy → application → Deployments).
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        if: env.DOKPLOY_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
